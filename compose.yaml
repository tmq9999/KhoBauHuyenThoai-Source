name: kbht-dev

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: kbht_dev
      POSTGRES_USER: kbht_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:25433:5432"
    volumes:
      - kbht-dev-postgres:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbht_admin -d kbht_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  postgres-test:
    profiles: ["test"]
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: kbht_test
      POSTGRES_USER: kbht_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:25434:5432"
    volumes:
      - kbht-test-postgres:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbht_admin -d kbht_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2.9-bookworm@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--protected-mode", "yes", "--aclfile", "/run/secrets/redis_acl"]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      # Probe transport + enforced authentication without exposing an application password.
      test: ["CMD-SHELL", "redis-cli ping 2>/dev/null | grep -q '^NOAUTH'"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    secrets:
      - redis_acl

volumes:
  kbht-dev-postgres:
  kbht-test-postgres:

secrets:
  postgres_password:
    file: ${KBHT_POSTGRES_PASSWORD_FILE:?set KBHT_POSTGRES_PASSWORD_FILE to a local secret file}
  redis_acl:
    file: ${KBHT_REDIS_ACL_FILE:?set KBHT_REDIS_ACL_FILE to an ACL file with default user off}
