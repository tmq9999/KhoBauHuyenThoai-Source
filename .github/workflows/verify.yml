name: Verify Native Source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install test runner
        run: python -m pip install pytest==9.0.2
      - name: Check every new delivery commit
        env:
          POLICY_BASE: 88a5cae1f870a3ed819fa617c56ec088574f6623
        run: python tools/ci/check_delivery_docs.py --base "$POLICY_BASE" --head HEAD
      - name: Verify static route artifact
        run: python tools/protocol/route_inventory.py --source client-recovered/src/project.js --output docs/protocol/vn-route-inventory.json --check --consumers docs/protocol/vn-core-consumers.json
      - name: Test source and loopback protocol
        run: python -m pytest -q tests server-compatible/tests/protocol -p no:cacheprovider
      - name: Test display patch in isolation
        run: node --test tests/client/test_power_display.mjs
      - name: Parse recovered and patched-source inputs without executing them
        run: |
          node --check client-recovered/src/project.js
          node --check client-recovered/src/settings.js
          node --check client-recovered/src/jsb_polyfill.js
          node --check client-recovered/patches/power-display.js
          git diff --check
