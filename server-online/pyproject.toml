[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kbht-server"
version = "0.1.0"
description = "PostgreSQL transaction foundation for the recovered native client"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.3.5",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
  "redis==6.4.0",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
kbht-server = "kbht_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kbht_server = ["db/alembic/*.py", "db/alembic/versions/*.py", "db/alembic/versions/*.sql", "battles/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["postgres: requires the isolated PostgreSQL test database"]
